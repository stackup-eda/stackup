[package]
name = "stackup-eda-parser"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Reads and writes stackup's KDL design format"
license = "MIT"
repository = "https://github.com/stackup-eda/stackup"
readme = "../../README.md"

[lib]
name = "stackup_kdl"

[dependencies]
kdl = "6.7"
miette = { version = "7.6", default-features = false, features = ["fancy-no-syscall"] }
