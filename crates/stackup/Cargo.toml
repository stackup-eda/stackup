[package]
name = "stackup-eda"
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
description = "Elaborates a stackup design and writes what a PCB tool imports"
license = "MIT"
repository = "https://github.com/stackup-eda/stackup"
readme = "README.md"

[lib]
name = "stackup"

[[bin]]
name = "stackup"
path = "src/main.rs"

[dependencies]
stackup-kdl = { package = "stackup-eda-parser", path = "../stackup-kdl", version = "0.1.0" }
miette = { version = "7.6", default-features = false, features = ["fancy-no-syscall"] }
